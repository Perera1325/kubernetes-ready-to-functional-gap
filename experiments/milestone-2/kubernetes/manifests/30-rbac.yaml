apiVersion: v1
kind: ServiceAccount
metadata: {name: rfg-collector, namespace: rfg}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: rfg-collector, namespace: rfg}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [get, list, watch, delete]}
  - {apiGroups: ["discovery.k8s.io"], resources: [endpointslices], verbs: [get, list, watch]}
  - {apiGroups: ["apps"], resources: [deployments, statefulsets], verbs: [get, list, watch]}
  - {apiGroups: ["apps"], resources: [deployments/scale], verbs: [get, patch, update]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: rfg-collector, namespace: rfg}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rfg-collector}
subjects: [{kind: ServiceAccount, name: rfg-collector, namespace: rfg}]
